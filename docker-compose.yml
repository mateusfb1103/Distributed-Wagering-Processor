services:
  postgres:
    image: ${POSTGRES_IMAGE:-mirror.gcr.io/library/postgres:17-alpine}
    environment:
      POSTGRES_DB: wagering
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 15

  ministack:
    image: ${MINISTACK_IMAGE:-ghcr.io/ministackorg/ministack:latest}
    ports:
      - "${SQS_PORT:-4566}:4566"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')\" || exit 1",
        ]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
